<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Elyos Starter — Prototype</title>
<style>
/* ============================================================
   ELYOS STARTER — DESIGN SYSTEM
   Noir profond · titane · argent brossé · blanc · or discret
   Esprit : horlogerie / blueprint / ingénierie · précision · contrôle
   ============================================================ */
:root{
  --noir:#08090A;
  --noir-2:#0C0E10;
  --surface:#101316;
  --surface-2:#15191D;
  --surface-3:#1B2024;
  --titane:#2A2F35;
  --titane-2:#363C44;
  --line:rgba(160,172,184,.10);
  --line-2:rgba(160,172,184,.16);
  --argent:#7F8893;
  --argent-2:#A7B0BB;
  --blanc:#EDF1F4;
  --or:#C8B49A;
  --or-bright:#E0CDB3;
  --or-dim:rgba(200,180,154,.14);
  --or-glow:rgba(200,180,154,.30);
  --green:#7FB89A;
  --red:#C58A82;
  --radius:18px;
  --radius-sm:12px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--sans);
  background:#050607;
  color:var(--blanc);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;
  /* blueprint backdrop on desktop */
  background-image:
    linear-gradient(rgba(160,172,184,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(160,172,184,.025) 1px,transparent 1px),
    radial-gradient(120% 80% at 50% -10%,rgba(200,180,154,.05),transparent 60%);
  background-size:34px 34px,34px 34px,100% 100%;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;}
::selection{background:var(--or-dim);}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- PHONE SHELL ---------- */
.phone{
  position:relative;
  width:100%;max-width:412px;height:100dvh;max-height:896px;
  background:var(--noir);
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px rgba(160,172,184,.07);
}
@media(min-width:480px){
  .phone{border-radius:42px;height:min(896px,94dvh);box-shadow:0 50px 140px rgba(0,0,0,.8),0 0 0 1px rgba(160,172,184,.10),0 0 0 11px #0c0d0f,0 0 0 12px rgba(160,172,184,.06);}
}
.statusbar{
  height:env(safe-area-inset-top,12px);min-height:12px;
  flex:0 0 auto;background:var(--noir);
}
#app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}

/* ---------- TOPBAR ---------- */
.topbar{
  flex:0 0 auto;
  padding:14px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(var(--noir),rgba(8,9,10,.0));
  position:relative;z-index:5;
}
.wordmark{display:flex;align-items:center;gap:9px;}
.wordmark .glyph{
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--or);position:relative;flex:0 0 auto;
}
.wordmark .glyph::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--or);}
.wordmark .name{font-size:15px;font-weight:600;letter-spacing:.26em;padding-left:.1em;}
.topbar .sub{font:500 10px/1 var(--mono);letter-spacing:.18em;color:var(--argent);text-transform:uppercase;margin-top:4px;}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(140deg,#23282d,#14171a);
  border:1px solid var(--line-2);
  display:grid;place-items:center;font:600 13px var(--sans);color:var(--argent-2);
}

/* ---------- SCREEN / SCROLL ---------- */
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.scroll{padding:4px 18px 120px;animation:fade .4s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* ---------- TYPE UTILITIES ---------- */
.eyebrow{font:500 10px/1.2 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--argent);}
.h1{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:2px 0 0;}
.h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0;}
.muted{color:var(--argent);}
.mono{font-family:var(--mono);}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px;}
.section-head .link{font:500 11px var(--mono);letter-spacing:.1em;color:var(--or);text-transform:uppercase;}

/* ---------- CARD (blueprint plate) ---------- */
.card{
  position:relative;
  background:linear-gradient(180deg,var(--surface),var(--noir-2));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
}
.card.tick::before,.card.tick::after{
  content:"";position:absolute;width:9px;height:9px;border:1px solid var(--line-2);
  pointer-events:none;
}
.card.tick::before{top:9px;left:9px;border-right:none;border-bottom:none;}
.card.tick::after{bottom:9px;right:9px;border-left:none;border-top:none;}

/* ---------- ALIGNMENT RING (signature) ---------- */
.dial-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;}
.dial{position:relative;width:230px;height:230px;}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);}
.dial .face{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.dial .pct{font:600 52px/1 var(--mono);letter-spacing:-.03em;color:var(--blanc);}
.dial .pct sup{font-size:20px;color:var(--or);font-weight:500;top:-1.4em;}
.dial .lbl{font:500 10px/1 var(--mono);letter-spacing:.24em;color:var(--argent);text-transform:uppercase;margin-top:9px;}
.dial .day{font:500 11px var(--mono);letter-spacing:.06em;color:var(--argent-2);margin-top:4px;}
.arc-track{stroke:var(--titane);}
.arc-day{stroke:var(--titane-2);}
.arc-fill{stroke:var(--or);transition:stroke-dashoffset 1s var(--ease);filter:drop-shadow(0 0 5px var(--or-glow));}
.tickmark{stroke:var(--titane-2);}
.tickmark.maj{stroke:var(--argent);}

/* ---------- PROGRESS BAR ---------- */
.bar{height:4px;border-radius:4px;background:var(--titane);overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--or);transition:width .7s var(--ease);}
.bar.green > i{background:var(--green);}
.bar.silver > i{background:var(--argent-2);}
.bar.gold > i{background:linear-gradient(90deg,var(--or-dim),var(--or-bright,var(--or)));}
.objdual{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.objdual .gz{min-width:0;}
.gz-k{font:500 9.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--argent);}
.gz-v{font:600 30px/1 var(--mono);color:var(--blanc);letter-spacing:-.03em;margin:8px 0 4px;}
.gz-v.gold{color:var(--or);}
.gz-s{font-size:12.5px;color:var(--argent-2);line-height:1.35;}
.align-sub{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;}
.align-pill{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.02em;color:var(--argent-2);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;}
.align-pill.off{color:var(--argent);opacity:.7;}
.align-dot{width:6px;height:6px;border-radius:50%;background:var(--argent-2);}
.align-pill.off .align-dot{background:var(--titane-2);}
.align-detail{font-size:11px;color:var(--argent);}
.objline{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 2px;}
.mono.v1{font:600 30px/1 var(--mono);color:var(--or);letter-spacing:-.03em;}
.mono.v2{font:500 18px var(--mono);color:var(--argent-2);}
.actrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);}
.actrow:last-of-type{border-bottom:none;}
.actrow .check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--titane-2);display:grid;place-items:center;flex:0 0 auto;cursor:pointer;transition:.2s;}
.actrow .check svg{width:14px;height:14px;opacity:0;transition:.2s;}
.actrow.done .check{background:var(--or);border-color:var(--or);}
.actrow.done .check svg{opacity:1;}
.actrow .ab{flex:1;min-width:0;cursor:pointer;}
.actrow .ab .t{font-size:14.5px;font-weight:500;color:var(--blanc);}
.actrow.done .ab .t{color:var(--argent-2);text-decoration:line-through;text-decoration-color:var(--titane-2);}
.actrow .ab .meta{font:500 10.5px var(--mono);letter-spacing:.04em;color:var(--argent);margin-top:3px;}
.actrow .actdel{width:28px;height:28px;border-radius:8px;background:transparent;border:none;color:var(--argent);display:grid;place-items:center;flex:0 0 auto;transition:.2s;}
.actrow .actdel:active{background:var(--surface-2);color:var(--red);}
.actrow .actdel svg{width:14px;height:14px;}
.rstep .actdel{width:26px;height:26px;border-radius:7px;background:transparent;border:none;color:var(--argent);display:grid;place-items:center;flex:0 0 auto;margin-left:auto;}
.rstep .actdel svg{width:13px;height:13px;}

/* ---------- OBJECTIVE ROW ---------- */
.obj{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.obj:last-child{border-bottom:none;}
.obj .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:12px;}
.obj .name{font-size:14.5px;font-weight:500;}
.obj .dom{font:500 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--argent);}
.obj .val{font:600 13px var(--mono);color:var(--or);}
.type-tag{font:500 8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--argent);border:1px solid var(--line-2);padding:2px 6px;border-radius:5px;}

/* ---------- ACTION ITEM ---------- */
.action{
  display:flex;align-items:center;gap:13px;padding:14px 16px;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  margin-bottom:9px;background:var(--surface);transition:.25s var(--ease);cursor:pointer;
}
.action:active{transform:scale(.985);}
.action.done{background:var(--noir-2);border-color:transparent;}
.check{
  width:23px;height:23px;border-radius:7px;border:1.5px solid var(--titane-2);
  flex:0 0 auto;display:grid;place-items:center;transition:.2s var(--ease);
}
.action.done .check{background:var(--or);border-color:var(--or);}
.check svg{width:12px;height:12px;opacity:0;transform:scale(.4);transition:.2s var(--ease);}
.action.done .check svg{opacity:1;transform:scale(1);}
.action .body{flex:1 1 auto;min-width:0;}
.action .t{font-size:14.5px;font-weight:500;transition:.25s;}
.action.done .t{color:var(--argent);text-decoration:line-through;text-decoration-color:var(--titane-2);}
.action .meta{font:500 10px var(--mono);letter-spacing:.06em;color:var(--argent);margin-top:3px;display:flex;gap:8px;align-items:center;}
.chev{color:var(--titane-2);flex:0 0 auto;}
.action.grouped .check{border-radius:50%;}

/* routine inline summary on action */
.mini{font:600 11px var(--mono);color:var(--argent-2);flex:0 0 auto;}

/* ---------- QUICK ACTIONS ---------- */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.qa{
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);
  padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:.2s var(--ease);
}
.qa:active{transform:scale(.95);background:var(--surface-2);}
.qa svg{width:21px;height:21px;color:var(--argent-2);}
.qa span{font-size:10.5px;font-weight:500;color:var(--argent-2);text-align:center;line-height:1.25;}

/* ---------- CHIPS / SEGMENTED ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  font:500 12px var(--sans);padding:8px 13px;border-radius:999px;
  border:1px solid var(--line-2);color:var(--argent-2);background:var(--surface);transition:.2s;
}
.chip.on{background:var(--or);color:#1A1206;border-color:var(--or);font-weight:600;}
.chip.dom{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;}
.seg{display:flex;background:var(--noir-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px;border-radius:8px;font:500 11.5px var(--mono);letter-spacing:.05em;color:var(--argent);transition:.2s;}
.seg button.on{background:var(--surface-3);color:var(--blanc);box-shadow:0 1px 0 rgba(255,255,255,.04) inset;}

/* ---------- BUTTONS ---------- */
.btn{
  width:100%;padding:15px;border-radius:13px;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s var(--ease);
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--or);color:#15100A;}
.btn-primary:active{background:var(--or-bright);}
.btn-ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--blanc);}
.btn-line{background:transparent;border:1px solid var(--or);color:var(--or);}
.btn-sm{padding:11px 14px;font-size:13px;border-radius:10px;width:auto;}
.btn svg{width:17px;height:17px;flex:0 0 auto;}
.btn-sm svg{width:14px;height:14px;}
.chip svg{width:12px;height:12px;flex:0 0 auto;vertical-align:-1px;}

/* ---------- BOTTOM NAV ---------- */
.nav{
  flex:0 0 auto;position:relative;z-index:6;
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 8px calc(10px + env(safe-area-inset-bottom,8px));
  background:rgba(8,9,10,.86);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 10px;position:relative;flex:1;}
.nav svg{width:22px;height:22px;color:var(--argent);transition:.2s;stroke-width:1.6;}
.nav span{font:500 9px var(--mono);letter-spacing:.08em;color:var(--argent);transition:.2s;text-transform:uppercase;}
.nav button.on svg{color:var(--or);}
.nav button.on span{color:var(--blanc);}
.nav button.on::before{content:"";position:absolute;top:-11px;width:18px;height:2px;border-radius:2px;background:var(--or);box-shadow:0 0 6px var(--or-glow);}

/* ---------- SHEET (bottom modal) ---------- */
.scrim{position:absolute;inset:0;background:rgba(2,3,4,.6);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:.3s;}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;
  background:var(--noir-2);border-top:1px solid var(--line-2);
  border-radius:26px 26px 0 0;
  transform:translateY(110%);transition:transform .42s var(--ease);
  max-height:90%;display:flex;flex-direction:column;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);
}
.sheet.on{transform:none;}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--titane-2);margin:11px auto 4px;flex:0 0 auto;}
.sheet .sh-head{padding:8px 22px 14px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;}
.sheet .sh-body{padding:0 22px 26px;overflow-y:auto;}
.sh-close{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--argent);}
.sh-close svg{width:18px;height:18px;}

/* ---------- FIELDS ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--argent);margin-bottom:7px;}
.type-hint{color:var(--or);text-transform:none;letter-spacing:0;font-size:10px;}
.field input,.field textarea,.field select{
  width:100%;padding:13px 14px;border-radius:11px;background:var(--surface);
  border:1px solid var(--line-2);color:var(--blanc);font-size:15px;outline:none;transition:.2s;
}
.field input:focus,.field textarea:focus{border-color:var(--or);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}

/* stepper */
.step-num{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:10px;padding:6px;}
.step-num button{width:34px;height:34px;border-radius:8px;background:var(--surface-2);font-size:18px;color:var(--argent-2);}
.step-num .v{flex:1;text-align:center;font:600 16px var(--mono);}

/* ---------- STAT GRID ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;background:var(--surface);}
.stat .k{font:500 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--argent);}
.stat .v{font:600 22px var(--mono);margin-top:6px;letter-spacing:-.02em;}
.stat .v small{font-size:12px;color:var(--argent);font-weight:500;}
.stat .d{font:500 10px var(--mono);margin-top:4px;}
.up{color:var(--green);}.down{color:var(--red);}

/* ---------- DOMAIN / LIST ROWS ---------- */
.lrow{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);}
.lrow:last-child{border-bottom:none;}
.lrow .ic{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto;color:var(--argent-2);border:1px solid var(--line);}
.lrow .ic svg{width:18px;height:18px;}
.lrow .lb{flex:1;min-width:0;}
.lrow .lb .n{font-size:14.5px;font-weight:500;}
.lrow .lb .s{font:500 11px var(--mono);color:var(--argent);margin-top:3px;}
.lrow .prio,.prirow .prio{width:22px;height:22px;border-radius:7px;background:var(--surface-2);border:1px solid var(--or-dim);color:var(--or);font:600 11px var(--mono);display:grid;place-items:center;flex:0 0 auto;}
.objmini{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--argent);margin-top:7px;}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;cursor:pointer;transition:.2s;}
.tcard:active{transform:scale(.985);border-color:var(--or-dim);}
.tcard .th{display:flex;align-items:center;gap:7px;}
.tdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.tcard .tn{font-size:13px;color:var(--argent-2);}
.tcard .tv{margin-top:9px;font:600 16px var(--mono);color:var(--blanc);font-variant-numeric:tabular-nums;}
.barchart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:108px;}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px;}
.bfill{width:100%;max-width:20px;border-radius:5px;background:linear-gradient(180deg,var(--titane-2),var(--titane));transition:height .7s var(--ease);}
.bfill.now{background:linear-gradient(180deg,var(--or-bright,var(--or)),var(--or-dim));}
.bfill.empty{background:var(--line-2);opacity:.5;}
.bday{font:500 10px var(--mono);color:var(--argent);}
.bday.now{color:var(--or);}
.dial-proof{text-align:center;margin-top:12px;font-size:12.5px;color:var(--argent-2);font-variant-numeric:tabular-nums;}
.swipe-wrap{position:relative;overflow:hidden;border-radius:var(--radius-sm);margin-bottom:9px;}
.swipe-actions{position:absolute;inset:0 0 0 auto;display:flex;align-items:stretch;}
.swipe-actions button{border:none;width:75px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;}
.swipe-actions button svg{width:16px;height:16px;}
.sw-edit{background:var(--surface-3,var(--surface-2));color:var(--or);}
.sw-del{background:rgba(190,60,60,.9);color:#fff;}
.swipe-face{position:relative;z-index:1;transition:transform .26s var(--ease);background:var(--surface);margin-bottom:0!important;}
.swipe-wrap.open .swipe-face{transform:translateX(-150px);}
.row-menu{width:30px;height:30px;border-radius:8px;background:transparent;border:none;color:var(--argent);display:grid;place-items:center;flex:0 0 auto;}
.row-menu svg{width:15px;height:15px;}
.row-menu:active{background:var(--surface-2);}
.newtag{color:var(--or);}
.opt-field label{display:flex;align-items:center;gap:7px;}
.opt-tag{font:500 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--argent);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:2px 7px;}
.btn-danger{background:rgba(190,60,60,.92);color:#fff;border:1px solid rgba(190,60,60,.5);}
.sys-link{text-align:center;margin-top:16px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--or);cursor:pointer;}
.streak-badge{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px;padding:8px 12px;border-radius:20px;background:rgba(201,162,77,.09);border:1px solid var(--or-dim);}
.streak-badge .sb-ic{display:grid;place-items:center;color:var(--or);}
.streak-badge .sb-ic svg{width:14px;height:14px;}
.streak-badge .sb-n{font:600 15px var(--mono);color:var(--or);font-variant-numeric:tabular-nums;}
.streak-badge .sb-l{font-size:11.5px;color:var(--argent-2);}
.endday-score{text-align:center;padding:8px 0 2px;}
.endday-score .eds-v{font:600 52px/1 var(--mono);color:var(--or);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.endday-score .eds-v sup{font-size:20px;}
.endday-score .eds-l{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--argent);margin-top:8px;}
.cyc-hero{text-align:center;padding:14px 0 6px;border-bottom:1px solid var(--line);}
.cyc-hero .ch-k{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--argent);}
.cyc-hero .ch-v{font:600 62px/1 var(--mono);color:var(--or);letter-spacing:-.04em;margin:12px 0 6px;font-variant-numeric:tabular-nums;}
.cyc-hero .ch-v sup{font-size:22px;}
.cyc-hero .ch-l{font-size:12px;color:var(--argent-2);padding-bottom:14px;}
.jrn{font:500 13px var(--mono);color:var(--argent);font-variant-numeric:tabular-nums;white-space:nowrap;}
.jrn .jv{color:var(--blanc);font-weight:600;}
.jrn .arw{color:var(--titane-2);margin:0 1px;}
.mono,.val,.pct,.gz-v,.jrn,.big{font-variant-numeric:tabular-nums;}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
.heat .hc{aspect-ratio:1;border-radius:4px;border:1px solid var(--line);}
.heatleg{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:12px;font:500 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--argent);}
.heatleg i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);}
.prilist{margin:2px 0;}
.prirow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.prirow:last-child{border-bottom:none;}
.prirow .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto;color:var(--argent-2);border:1px solid var(--line);}
.prirow .ic svg{width:16px;height:16px;}
.prirow .lb{flex:1;min-width:0;}.prirow .lb .n{font-size:14px;font-weight:500;}
.primv{display:flex;gap:6px;flex:0 0 auto;}
.primv button{width:30px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--argent-2);display:grid;place-items:center;}
.primv button:disabled{opacity:.3;}
.primv button svg{width:15px;height:15px;}
.primv button:first-child svg{transform:rotate(-90deg);}
.primv button:last-child svg{transform:rotate(90deg);}

/* ---------- SYSTEM / LIBRARY CARDS ---------- */
.sys{
  position:relative;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(155deg,var(--surface),var(--noir-2));padding:16px;margin-bottom:12px;overflow:hidden;
}
.sys .badge{position:absolute;top:14px;right:14px;font:500 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--or);border:1px solid var(--or-dim);padding:3px 7px;border-radius:6px;}
.sys h3{font-size:16px;font-weight:600;margin:0 70px 4px 0;}
.sys p{font-size:12.5px;color:var(--argent);margin:0 0 13px;line-height:1.5;}
.sys .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.sys .stat-line{display:flex;gap:16px;font:500 10px var(--mono);color:var(--argent);letter-spacing:.05em;}
.sys .stat-line b{color:var(--argent-2);font-weight:600;}

/* ---------- ACADEMY ---------- */
.aca-cat{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--or);margin:24px 2px 12px;}
.aca{border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px;margin-bottom:10px;background:var(--surface);transition:.2s;}
.aca:active{background:var(--surface-2);}
.aca h4{font-size:14.5px;font-weight:600;margin:0 0 5px;}
.aca .read{font:500 10px var(--mono);color:var(--argent);letter-spacing:.05em;}
.aca .cta{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--or);font-weight:500;}
.aca .cta svg{width:15px;height:15px;}

/* ---------- ROUTINE STEP ---------- */
.rstep{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.rstep:last-child{border-bottom:none;}
.rstep .tm{font:600 11px var(--mono);color:var(--argent);width:42px;flex:0 0 auto;letter-spacing:.02em;}
.rstep.done .tm{color:var(--or);}
.rdot{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--titane-2);flex:0 0 auto;display:grid;place-items:center;transition:.2s;}
.rstep.done .rdot{background:var(--or);border-color:var(--or);}
.rdot svg{width:11px;height:11px;opacity:0;transition:.2s;}
.rstep.done .rdot svg{opacity:1;}
.rstep .rl{font-size:14px;font-weight:500;flex:1;}
.rstep.done .rl{color:var(--argent);text-decoration:line-through;text-decoration-color:var(--titane-2);}

/* ---------- SPORT SETS ---------- */
.ex{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:11px;background:var(--surface);overflow:hidden;}
.ex .exh{display:flex;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line);}
.ex .exh .nm{font-size:14px;font-weight:600;flex:1;min-width:0;}
.ex .exh .pr{font:500 10px var(--mono);color:var(--argent);}
.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) 56px 50px 32px;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);transition:background .2s;}
.setrow:last-child{border-bottom:none;}
.setrow.done{background:rgba(58,160,90,.07);}
.setrow .sn{font:600 12px var(--mono);color:var(--argent);}
.setrow .prev{font:500 10.5px var(--mono);color:var(--argent);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.setrow .cell{background:var(--noir-2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font:600 13px var(--mono);color:var(--blanc);width:100%;outline:none;}
.setrow .cell:focus{border-color:var(--or);}
.sethead{display:grid;grid-template-columns:24px minmax(0,1fr) 56px 50px 32px;gap:8px;padding:6px 14px;font:500 8.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--argent);}
.sethead div{text-align:center;}.sethead div:first-child,.sethead div:nth-child(2){text-align:left;}
.exgrp{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--argent);margin-left:8px;}
.exmenu{width:26px;height:26px;border-radius:7px;background:var(--surface-2);border:none;color:var(--argent);display:grid;place-items:center;flex:0 0 auto;}
.exmenu svg{width:13px;height:13px;}
.restbar{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-radius:14px;background:rgba(18,20,23,.96);border:1px solid var(--or-dim);backdrop-filter:blur(14px);box-shadow:0 14px 44px rgba(0,0,0,.55);animation:fade .25s var(--ease);}
.restbar .rt{font:600 14px var(--mono);color:var(--or);letter-spacing:.02em;}
.restbar .ra{display:flex;gap:8px;}
.restbar .ra button{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--argent);background:var(--surface-2);border:none;padding:8px 11px;border-radius:8px;}
.liblist{max-height:48vh;overflow-y:auto;margin:0 -2px;}
.libgrp{font:500 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--argent);padding:13px 2px 6px;}
.libitem{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);}
.libitem .t{font-size:14px;font-weight:500;}
.libitem:active{opacity:.55;}
.libfig{width:30px;height:44px;display:grid;place-items:center;flex:0 0 auto;margin-right:11px;opacity:.9;}
.libfig .msvg{width:26px;height:40px;}
.wcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin-bottom:11px;cursor:pointer;transition:.2s;}
.wcard:active{transform:scale(.99);border-color:var(--or-dim);}
.wfig{width:52px;height:72px;border-radius:12px;background:var(--noir-2);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;}
.wbody{flex:1;min-width:0;}
.wname{font-size:16px;font-weight:600;color:var(--blanc);}
.wmeta{font:500 11px var(--mono);color:var(--argent);margin-top:3px;}
.wtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.wtag{font:500 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--or);background:rgba(201,162,77,.10);border:1px solid var(--or-dim);border-radius:20px;padding:3px 8px;}
.wex{font-size:11.5px;color:var(--argent-2);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exfig{width:26px;height:38px;display:grid;place-items:center;flex:0 0 auto;margin-right:10px;opacity:.9;}
.exfig .msvg{width:24px;height:36px;}
.setdone{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--titane-2);display:grid;place-items:center;transition:.2s;}
.setdone.on{background:var(--green);border-color:var(--green);}
.setdone svg{width:13px;height:13px;opacity:0;}.setdone.on svg{opacity:1;}

/* ---------- NUTRITION RING ---------- */
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.macro .m{text-align:center;}
.macro .mlbl{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--argent);margin-bottom:6px;}
.macro .mval{font:600 13px var(--mono);margin-top:6px;}
.meal{margin-top:16px;}
.meal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.meal .mh .mn{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--argent-2);}
.fooditem{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--surface);}
.fooditem .fn{font-size:13.5px;font-weight:500;}
.fooditem .fk{font:500 11px var(--mono);color:var(--argent);}

/* ---------- ADDICTION ---------- */
.streak{text-align:center;padding:10px 0;}
.streak .big{font:600 64px/1 var(--mono);color:var(--or);letter-spacing:-.04em;}
.streak .u{font:500 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--argent);margin-top:6px;}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:16px 0 4px;}
.ddot{width:9px;height:9px;border-radius:2px;background:var(--titane);}
.ddot.ok{background:var(--green);}
.ddot.relapse{background:var(--red);}

/* ---------- ONBOARDING ---------- */
.ob{flex:1;display:flex;flex-direction:column;padding:0 24px;overflow-y:auto;}
.ob-top{padding:18px 0 8px;flex:0 0 auto;}
.ob-progress{display:flex;gap:6px;margin-bottom:30px;}
.ob-progress i{flex:1;height:3px;border-radius:3px;background:var(--titane);transition:.4s;}
.ob-progress i.on{background:var(--or);}
.ob-body{flex:1;animation:fade .35s var(--ease);}
.ob .step-k{font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--or);}
.ob h1{font-size:27px;font-weight:600;letter-spacing:-.025em;margin:6px 0 8px;line-height:1.15;}
.ob .lede{font-size:14px;color:var(--argent);line-height:1.55;margin-bottom:26px;}
.ob-foot{flex:0 0 auto;padding:14px 0 calc(20px + env(safe-area-inset-bottom,8px));}
.ob-tip{text-align:center;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--argent);padding:15px;opacity:.7;}
.ob-back-link{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--or);margin-bottom:14px;}
.ob-back-link svg{width:12px;height:12px;transform:rotate(180deg);}
.ob-back{background:none;color:var(--argent);margin-top:2px;font-weight:500;font-size:13px;}
.opt{
  border:1px solid var(--line-2);border-radius:15px;padding:17px;margin-bottom:11px;
  display:flex;align-items:center;gap:14px;transition:.2s var(--ease);background:var(--surface);
}
.opt:active{transform:scale(.985);}
.opt.on{border-color:var(--or);background:linear-gradient(var(--or-dim),transparent);}
.opt .obadge{font:600 13px var(--mono);width:42px;height:42px;border-radius:11px;background:var(--noir-2);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:var(--argent-2);}
.opt .obadge svg{width:18px;height:18px;}
.opt.on .obadge{background:var(--or);color:#15100A;border-color:var(--or);}
.opt .ob-t{font-size:15.5px;font-weight:600;}
.opt .ob-s{font:500 11px var(--mono);color:var(--argent);margin-top:3px;letter-spacing:.03em;}
.opt .rec{margin-left:auto;font:500 8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--or);border:1px solid var(--or-dim);padding:3px 7px;border-radius:6px;flex:0 0 auto;}
.elyos-mark{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:8vh;animation:fade .6s var(--ease);}
.elyos-mark .ring{width:84px;height:84px;border-radius:50%;border:2px solid var(--or);position:relative;}
.elyos-mark .ring::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--or);box-shadow:0 0 24px var(--or-glow);}
.elyos-mark .nm{font-size:24px;font-weight:600;letter-spacing:.3em;padding-left:.15em;}
.elyos-mark .tg{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--argent);}

/* ---------- TOAST ---------- */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:60;
  background:var(--surface-3);border:1px solid var(--line-2);border-radius:12px;
  padding:12px 18px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.3s var(--ease);
  display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:86%;
}
.toast.on{opacity:1;transform:translate(-50%,0);}
.toast svg{width:16px;height:16px;color:var(--or);flex:0 0 auto;}

/* ---------- MISC ---------- */
.divider{height:1px;background:var(--line);margin:20px 0;}
.note{font-size:12px;color:var(--argent);line-height:1.55;}
.kicker{display:inline-flex;align-items:center;gap:6px;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--argent);}
.kicker svg{width:13px;height:13px;flex:0 0 auto;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--or);display:inline-block;}
.hint{border:1px solid var(--line);border-left:2px solid var(--or);border-radius:8px;padding:12px 14px;background:rgba(200,180,154,.04);font-size:12px;color:var(--argent-2);line-height:1.55;}
.empty{text-align:center;padding:40px 20px;color:var(--argent);}
.toggle{width:44px;height:26px;border-radius:14px;background:var(--titane);position:relative;transition:.25s;flex:0 0 auto;}
.toggle.on{background:var(--or);}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s var(--ease);}
.toggle.on::after{transform:translateX(18px);}
.cyc-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.cyc-actions .btn{margin:0;}
.asst-banner{display:flex;align-items:center;gap:13px;padding:15px 16px;margin-top:10px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(201,162,77,.10),rgba(201,162,77,.02));border:1px solid var(--or-dim);cursor:pointer;transition:.2s;}
.asst-banner:active{transform:scale(.99);}
.asst-banner .ab-ic{width:38px;height:38px;border-radius:11px;background:rgba(201,162,77,.14);border:1px solid var(--or-dim);display:grid;place-items:center;color:var(--or);flex:0 0 auto;}
.asst-banner .ab-ic svg{width:18px;height:18px;}
.asst-banner .ab-tx{flex:1;min-width:0;}
.asst-banner .ab-t{font-size:14.5px;font-weight:600;color:var(--blanc);}
.asst-banner .ab-s{font-size:11.5px;color:var(--argent-2);margin-top:2px;}
.asst-banner .chev{color:var(--or);}
.spacer{height:6px;}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar"></div>
  <div id="app"></div>
  <div class="scrim" id="scrim" data-act="close-sheet"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>

  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg>',

/* alignment = part des actions du jour réalisées (pondérée) */
function dayAlignment(){
  let done=0,tot=0;
  DB.actions.filter(a=>a.today!==false).forEach(a=>{
    const w = (a.type==='routine'||a.type==='workout')?2:1;
    const isNew = a.createdDay===DB.cycle.day;   // ajoutée aujourd'hui : ne peut que faire gagner
    if(actionDone(a)){ done+=w; tot+=w; }
    else if(!isNew){ tot+=w; }
  });
  return tot? Math.round(done/tot*100):0;
}
/* Le domaine d'une habitude dérive de son objectif — jamais demandé à l'utilisateur */
function actDomain(a){
  const ids=actObjIds(a);
  for(const id of ids){ const o=DB.objectives.find(x=>x.id===id); if(o) return o.dom; }
  return a.dom||'';
}
function nutritionTotalToday(){ return DB.nutrition.meals.reduce((a,m)=>{m.items.forEach(i=>{a.k+=i.k;a.p+=i.p;});return a;},{k:0,p:0}); }
function actionDone(a){
  if(a.type==='routine'){ const r=DB.routines.find(r=>r.id===a.ref); return r && r.steps.every(s=>s.done); }
  if(a.type==='nutrition'){ return nutritionTotalToday().k>0; }
  return a.done;
}
function routineProgress(r){ const d=r.steps.filter(s=>s.done).length; return {done:d,tot:r.steps.length,pct:Math.round(d/r.steps.length*100)}; }
function frNum(n){ return (Math.round(n*10)/10).toString().replace('.',','); }
function objProg(o){
  if(o.type==='etapes'){ return o.steps.length?Math.round(o.steps.filter(s=>s.done).length/o.steps.length*100):0; }
  if(o.type==='manuel'){ return clamp(Math.round(o.current||0),0,100); }
  const span=(o.target-(o.start||0))||1;
  return clamp(Math.round((o.current-(o.start||0))/span*100),0,100);
}
function objResult(o){
  if(o.type==='etapes'){ const d=o.steps.filter(s=>s.done).length; return d+' / '+o.steps.length+' étapes'; }
  if(o.type==='mesurable'){ return frNum(o.current)+' / '+o.target+(o.unit?' '+o.unit:''); }
  if(o.type==='streak'){ return o.current+' j / '+o.target+' j'; }
  if(o.type==='manuel'){ return (o.current||0)+'% · estimé'; }
  return frNum(o.current)+' / '+o.target+(o.unit?' '+o.unit:''); // quantitatif & tracker
}
/* Résultat "trajet" : départ → actuel → cible (langage visuel repris de la maquette Design) */
function objJourney(o){
  const cur=v=>'<b class="jv">'+v+'</b>';
  if(o.type==='etapes'){ const d=o.steps.filter(s=>s.done).length; return 'Étape '+cur(d)+' / '+o.steps.length; }
  if(o.type==='manuel'){ return cur((o.current||0)+'%')+' estimé'; }
  if(o.type==='streak'){ return cur(o.current)+' / '+o.target+' j'; }
  if(o.type==='mesurable'){
    return frNum(o.start||0)+' <span class="arw">→</span> '+cur(frNum(o.current))+' <span class="arw">→</span> '+o.target+(o.unit?' '+esc(o.unit):'');
  }
  return cur(frNum(o.current))+' / '+o.target+(o.unit?' '+esc(o.unit):''); // quantitatif
}
function objAlignDetail(o){
  const acts=objActions(o).filter(a=>a.today!==false);
  if(!acts.length) return null;
  let done=0,tot=0,doneCount=0;
  acts.forEach(a=>{ const w=(a.type==='routine'||a.type==='workout')?2:1; tot+=w; if(actionDone(a)){done+=w;doneCount++;} });
  return {done:doneCount,tot:acts.length,pct:Math.round(done/tot*100)};
}
function objAlign(o){ const d=objAlignDetail(o); return d?d.pct:0; }
function objActions(o){ return DB.actions.filter(a=>(a.objIds||[]).includes(o.id)); }
function actObjIds(a){ return a.objIds||(a.objId?[a.objId]:[]); }
function recomputeProg(o){ o.progress=objProg(o); }
/* --- Domaines : hiérarchie de priorité (l'ordre = la priorité) --- */
function domRank(dom){ const i=DB.domains.indexOf(dom); return i<0?DB.domains.length:i; }
function domWeight(dom){ const i=DB.domains.indexOf(dom); if(i<0) return 1; return 1 + (DB.domains.length-1-i)*0.12; } // domaine prioritaire = plus de poids
/* --- Stats d'alignement --- */
function avg(a){ return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):0; }
/* --- Streak d'alignement : jours consécutifs au-dessus du seuil --- */
const ALIGN_OK=70;   // seuil "journée alignée"
function alignStreak(){
  const today=dayAlignment();
  const todayCounts = today>=ALIGN_OK;
  let n = todayCounts?1:0;
  for(let i=DB.alignHistory.length-1;i>=0;i--){
    if(DB.alignHistory[i]>=ALIGN_OK) n++; else break;
  }
  return {n, todayCounts, today};
}
function bestStreak(){

/* --- Clôture de journée : archive le score, met à jour les stats, remet à zéro le quotidien --- */
function advanceDay(){
  const score=dayAlignment();
  DB.alignHistory.push(score);
  DB.bestStreak=bestStreak();
  // stats par habitude (taux de réussite cumulé sur le cycle)
  DB.actions.filter(a=>a.today!==false).forEach(a=>{
    let st=DB.habitStats.find(h=>h.k===a.title);
    if(!st){ st={k:a.title,dom:a.dom,done:0,tot:0,pct:0}; DB.habitStats.push(st); }
    st.tot++; if(actionDone(a)) st.done++;
    st.pct=Math.round(st.done/st.tot*100);
  });
  // remise à zéro du jour
  DB.actions.forEach(a=>{ a.done=false; });
  DB.routines.forEach(r=>r.steps.forEach(s=>s.done=false));
  DB.nutrition.meals.forEach(m=>m.items.length=0);
  if(DB.cycle.day<DB.cycle.total) DB.cycle.day++;

  acts.forEach(a=>{ const w=(a.type==='routine'||a.type==='workout')?2:1; tot+=w; if(actionDone(a)){done+=w;doneCount++;} });
  return {done:doneCount,tot:acts.length,pct:Math.round(done/tot*100)};
}

    n+=det.pct*w; d+=w; doneActs+=det.done; totActs+=det.tot; domsCounted++; });

function guessActionTracker(title,dom){

function makeAction(title,dom,objIds,freq,forceTracker){
  let g = forceTracker ? ACTION_TRACKER_GUESS.find(x=>x.dom===dom && !DB.actions.some(a=>a.type===x.type)) : null;
  if(!g) g=guessActionTracker(title,dom);

    const forceEligible = b.type==='streak' && b.dom==='Addictions';

function instantiateSystem(sys){
  if(!sys||!sys.tpl) return null;
  const map=[]; const objInfo=(sys.tpl.objs||[]).map(od=>({dom:od.dom,type:od.type}));
  (sys.tpl.objs||[]).forEach(od=>{ map.push(instantiateObjective(od)); });
  const forcedFor=new Set();
  (sys.tpl.habits||[]).forEach(h=>{ const dom=h.dom||'Personnel'; const oid=(h.obj!=null&&map[h.obj])?map[h.obj]:null;
    const info=h.obj!=null?objInfo[h.obj]:null;
    const forceEligible = info && info.type==='streak' && info.dom==='Addictions';
    const force = oid!=null && forceEligible && !forcedFor.has(h.obj); if(force) forcedFor.add(h.obj);
    DB.actions.push(makeAction(h.t,dom,oid?[oid]:[],h.freq||'daily',force)); });

/* ============================================================
   ALIGNMENT DIAL (signature) — bezel à graduations, arc or
   ============================================================ */
function dialSVG(pct, dayPct){
  const R=104, Rd=94, C=2*Math.PI*R, Cd=2*Math.PI*Rd;
  const off=C*(1-pct/100), offD=Cd*(1-dayPct/100);
  // graduation ticks (60), every 5th major — esprit bezel/ingénierie, sans chiffres
  let ticks='';
  for(let i=0;i<60;i++){
    const ang=(i/60)*2*Math.PI, maj=i%5===0;
    const r1=maj?118:121, r2=126;
    const x1=128+r1*Math.cos(ang), y1=128+r1*Math.sin(ang);
    const x2=128+r2*Math.cos(ang), y2=128+r2*Math.sin(ang);
    ticks+='<line class="tickmark'+(maj?' maj':'')+'" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke-width="'+(maj?1.4:0.8)+'"/>';
  }
  return '<svg viewBox="0 0 256 256">'
    + ticks
    + '<circle class="arc-day" cx="128" cy="128" r="'+Rd+'" fill="none" stroke-width="2" stroke-dasharray="'+Cd+'" stroke-dashoffset="'+offD+'" stroke-linecap="round"/>'
    + '<circle class="arc-track" cx="128" cy="128" r="'+R+'" fill="none" stroke-width="7"/>'
    + '<circle class="arc-fill" cx="128" cy="128" r="'+R+'" fill="none" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/>'
    + '</svg>';
}

  else { hist+='<div class="card"><div class="note">Aucun cycle terminé pour l\u2019instant — celui en cours est ton premier. Tes cycles passés s\u2019archiveront ici, jamais supprimés.</div></div>'; }

  return cur + (comp?('<div class="spacer"></div>'+comp):'') + hist;

  {keys:['confian','estime','mental','anxi','stress','calme'],block:{dom:'Personnel',objName:'Devenir plus confiant',type:'manuel',habits:['Méditation 10 min','Journaling du soir']}}

function assistantEngine(text){
  const t=(text||'').toLowerCase();
  const blocks=[];
  ASST_INTENTS.forEach(it=>{ if(it.keys.some(k=>t.includes(k)) && !blocks.find(b=>b.dom===it.block.dom)) blocks.push(it.block); });
  const matched = blocks.length>0;
  if(!blocks.length){ blocks.push(ASST_INTENTS[0].block, ASST_INTENTS[6].block); } // démarrage sain par défaut
  return {blocks:blocks.slice(0,3), matched};
}

    +'</div>').join('');

  {re:/\d+\s*(kg|kilo)|perdre|prendre du poids|peser/i, type:'mesurable'},
  {re:/jours? sans|streak|arrêt|sevrage|nicotine|clope|alcool|porn|sucre/i, type:'streak'},

function vol(ex){return ex.reduce((v,e)=>v+e.sets.reduce((x,s)=>x+(s.done?s.kg*s.reps:0),0),0);}
function setsDone(ex){return ex.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);}
function setsTot(ex){return ex.reduce((n,e)=>n+e.sets.length,0);}

function sportTick(){
  const a=DB.sport.active; if(!a){ensureSportTimer(false);return;}
  const c1=$('#sessChrono'),c2=$('#sessChrono2'),d=fmtDur(Date.now()-a.started);
  if(c1)c1.textContent=d; if(c2)c2.textContent=d;
  if(restEnd){const rem=restEnd-Date.now(),rp=$('#restPill'),rb=$('#restBar');
    if(rem<=0){restEnd=null; if(rb)rb.remove(); toast('Repos terminé');}
    else if(rp)rp.textContent=fmtDur(rem);}
}
function ensureSportTimer(on){
  if(on){ if(!sportTimer) sportTimer=setInterval(sportTick,1000); }
  else if(sportTimer){ clearInterval(sportTimer); sportTimer=null; }
}

      +'<button class="btn btn-ghost btn-sm" style="margin-top:10px;width:100%" data-act="addstep" data-id="'+o.id+'">'+I.plus+'Ajouter une étape</button></div>';
  } else if(o.type==='streak'){
    panel='<div class="card tick" style="text-align:center;padding-top:18px"><div class="streak"><div class="big">'+o.current+'</div><div class="u">jours / '+o.target+'</div></div>'
      +'<div class="bar gold" style="margin:16px 0"><i style="width:'+prog+'%"></i></div>'
      +'<div style="display:flex;gap:9px"><button class="btn btn-primary" data-act="streakplus" data-id="'+o.id+'" style="flex:1">'+I.plus+'+1 jour tenu</button>'
      +'<button class="btn btn-line" data-act="streakreset" data-id="'+o.id+'" style="flex:0 0 92px">Rechute</button></div></div>';
  } else if(o.type==='tracker'){
    panel='<div class="card"><div class="eyebrow">Suivi via tracker · '+esc(o.unit||'')+'</div>'
      +'<div class="mono" style="font-size:34px;color:var(--or);text-align:center;margin:12px 0 2px">'+frNum(o.current)+'<span style="color:var(--argent-2);font-size:18px"> / '+o.target+'</span></div>'
      +'<div class="note" style="text-align:center;margin-bottom:14px">'+I.spark+' Synchronisé avec ton tracker</div>'
      +'<button class="btn btn-primary" data-act="sheet" data-id="ci-'+o.id+'">'+I.target+'Mettre à jour la mesure</button></div>';
  } else if(o.type==='manuel'){
    panel='<div class="card"><div class="eyebrow" style="margin-bottom:6px">Avancement estimé</div>'
      +'<div class="mono" style="font-size:40px;text-align:center;color:var(--or);margin:6px 0">'+(o.current||0)+'%</div>'
      +'<input type="range" min="0" max="100" value="'+(o.current||0)+'" data-act="manualset" data-id="'+o.id+'" style="width:100%;accent-color:var(--or)">'
      +'<div class="note" style="margin-top:10px;text-align:center">Ajuste à la main après réflexion — utile quand le résultat n\u2019est pas chiffrable.</div></div>';
  }

  const acts=objActions(o);
  const doneCnt=acts.filter(a=>actionDone(a)).length;
  let actBlock='<div class="section-head"><div class="h2">Habitudes</div><div class="kicker"><span class="dot"></span>'+doneCnt+'/'+acts.length+' faites</div></div>';
  actBlock+= acts.length
    ? acts.map(a=>'<div class="actrow '+(actionDone(a)?'done':'')+'">'
        +'<div class="check" data-act="toggle" data-id="'+a.id+'">'+I.check+'</div>'
        +'<div class="ab" data-act="actedit" data-id="'+a.id+'"><div class="t">'+esc(a.title)+'</div><div class="meta">'+freqLabel(a.freq)+' · '+esc(a.dom)+'</div></div>'
        +'<button class="actdel" data-act="actdelete" data-id="'+a.id+'">'+I.x+'</button></div>').join('')
    : '<div class="note" style="padding:4px 0 8px">Aucune habitude liée. Ajoute la première habitude qui fera avancer cet objectif.</div>';
  actBlock+='<button class="btn btn-ghost" data-act="objaddaction" data-id="'+o.id+'" style="margin-top:8px">'+I.plus+'Ajouter une habitude</button>';

  const hint='<div class="hint" style="margin:16px 0 18px">Tes <b style="color:var(--blanc)">actions</b> nourrissent ton <b style="color:var(--blanc)">alignement</b> (faire le travail). La <b style="color:var(--blanc)">progression</b> mesure le résultat réel : '+typeExplain(o.type)+'</div>';

  return subHeader(o.name,o.dom+' · '+TYPE_LABEL[o.type]+(o.targetDate?' · '+o.targetDate:''))+'<div class="view"><div class="scroll" style="padding-top:0">'
    + gauges + hint + panel + actBlock + '</div></div>';
}
/* ============================================================
   ONBOARDING (< 2 min)

const OB_DOMAINS=['Sport','Santé','Nutrition','Études','Business','Travail','Lifestyle','Mental','Digital','Addictions'];
function screenOnboarding(){
  const s=state.ob.step;
  if(s===0) return obIntro();
  const bars='<div class="ob-progress">'+[1,2,3,4].map(i=>'<i class="'+(i<=s?'on':'')+'"></i>').join('')+'</div>';
  let body='',foot='',canNext=false;

  if(s===1){
    body='<h1>Choisis la durée de ton cycle</h1>'
      +'<div class="lede">Un cycle est une période de transformation. Tu pourras l\u2019ajuster plus tard.</div>'
      + obOpt('30','Cycle court','30 jours · momentum rapide',state.ob.cycle==='30')
      + obOpt('90','Cycle standard','90 jours · le bon équilibre',state.ob.cycle==='90',true)
      + obOpt('180','Cycle long','180 jours · transformation profonde',state.ob.cycle==='180');
  }
  else if(s===2){
    const n=state.ob.domains.length;
    body='<h1>Sur quoi veux-tu avancer ?</h1>'
      +'<div class="lede">2 à 4 domaines, pas plus — pour rester concentré. Tu pourras en ajouter plus tard.</div>'
      +'<div class="chips">'+OB_DOMAINS.map(d=>'<span class="chip '+(state.ob.domains.includes(d)?'on':'')+'" data-act="obdom" data-id="'+d+'">'+d+'</span>').join('')+'</div>'
      +'<div class="note" style="margin-top:12px">'+n+'/4'+(n<2?' · choisis-en au moins 2':'')+'</div>';
    canNext=n>=2;
  }
  else if(s===3){
    const mode=state.ob.mode;
    if(!mode){
      body='<h1>Comment veux-tu démarrer ?</h1>'
        +'<div class="lede">Pour ne pas partir d\u2019une page blanche. Tu personnaliseras ensuite.</div>'
        + obModeOpt('ai','Décrire mon objectif','L\u2019assistant construit ton système',true)
        + obModeOpt('system','Choisir un système Elyos','Un système officiel prêt à l\u2019emploi')
        + obModeOpt('scratch','Partir de zéro','Je construis tout moi-même');
    } else if(mode==='ai'){
      const sugg=['Prendre du muscle et être plus productif','Arrêter la nicotine','Réussir mes études','Reprise en main complète'];
      body='<div class="ob-back-link" data-act="obmodeback">'+I.chev+' Changer de méthode</div>'
        +'<h1>Décris ce que tu veux devenir</h1>'
        +'<div class="lede">L\u2019assistant te propose des objectifs et habitudes que tu valides ensuite.</div>'
        +'<div class="field"><textarea id="obText" rows="3" placeholder="Ex. Je veux prendre du muscle et être plus productif…">'+esc(state.ob.text||'')+'</textarea></div>'
        +'<div class="chips">'+sugg.map(x=>'<span class="chip" data-act="obsugg" data-id="'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div>';
    } else if(mode==='system'){
      const curated=['s1','s2','s3','s4'];
      body='<div class="ob-back-link" data-act="obmodeback">'+I.chev+' Changer de méthode</div>'
        +'<h1>Choisis un système</h1>'
        +'<div class="lede">Objectifs et habitudes déjà prêts. Tu pourras tout ajuster.</div>'
        + curated.map(sid=>{ const sy=DB.systems.find(x=>x.id===sid); return obOpt(sid,sy.name,sy.desc,state.ob.system===sid); }).join('');
    }
  }
  else if(s===4){
    const usingAi = !!state.ob.aiBlocks;
    const usingSystem = state.ob.system && state.ob.system!=='scratch' && !usingAi;
    const sys = usingSystem ? DB.systems.find(x=>x.id===state.ob.system) : null;
    const previewBlocks = usingAi ? state.ob.aiBlocks : (sys ? tplToBlocks(sys.tpl) : null);

    if(previewBlocks && previewBlocks.length){
      body='<h1>Ton système est prêt</h1>'
        +'<div class="lede">Vérifie, puis démarre — tu pourras tout modifier ensuite.</div>'
        +'<div class="chips" style="margin-bottom:14px">'+state.ob.domains.map(d=>'<span class="chip dom on">'+d+'</span>').join('')+'</div>'
        + (usingAi && !state.ob.aiMatched ? '<div class="hint" style="margin-bottom:14px">Je n\u2019ai pas identifié d\u2019intention précise dans ta phrase — voici un point de départ simple à ajuster.</div>' : '')
        + proposalCards(previewBlocks);
    } else {
      body='<h1>Tout est prêt</h1>'
        +'<div class="lede">Tu démarres d\u2019une page blanche. Construis ton premier objectif dès ton arrivée.</div>'
        +'<div class="card tick"><div class="eyebrow">Récapitulatif</div>'
        +'<div class="lrow"><div class="lb"><div class="n">Cycle</div></div><div class="val mono" style="color:var(--or)">'+state.ob.cycle+' jours</div></div>'
        +'<div class="lrow"><div class="lb"><div class="n">Domaines</div></div><div class="val mono">'+state.ob.domains.length+'</div></div></div>'
        +'<div class="chips" style="margin-top:14px">'+state.ob.domains.map(d=>'<span class="chip dom on">'+d+'</span>').join('')+'</div>';
    }
  }

  // Steps 1 & (3 in system-pick) are single-select and auto-advance on tap, so they need no "Continuer".
  const s3ai = s===3 && state.ob.mode==='ai';
  const cta = s===4 ? '<button class="btn btn-primary" data-act="obfinish">'+((state.ob.aiBlocks||(state.ob.system&&state.ob.system!=='scratch'))?'Créer et démarrer mon cycle':'Démarrer mon cycle')+'</button>'
    : s===2 ? '<button class="btn '+(canNext?'btn-primary':'btn-ghost')+'" data-act="obnext" '+(canNext?'':'disabled style="opacity:.45;pointer-events:none"')+'>Continuer</button>'
    : s3ai ? '<button class="btn btn-primary" data-act="obpropose">'+I.spark+'Proposer mon système</button>'
    : '<div class="ob-tip">Touche une option pour continuer</div>';
  foot='<div class="ob-foot">'+cta
    + (s>1?'<button class="btn ob-back" data-act="obback">Retour</button>':'')
    + '</div>';

  return '<div class="ob"><div class="ob-top">'+bars+'</div><div class="ob-body">'+body+'</div>'+foot+'</div>';
}

    +'<div class="obadge">'+(id==='ai'?I.spark:id==='system'?I.layers:'∅')+'</div>'
    +'<div><div class="ob-t">'+esc(t)+'</div><div class="ob-s">'+esc(sub)+'</div></div>'
    +(rec?'<span class="rec">Recommandé</span>':'')+'</div>';

    +'<div class="tg">Construis-toi · jour après jour</div></div>'

   SHEETS (bottom modals — quick actions & co.)

function openSheet(id){

function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); render(); }
function shFrame(title,body){
  return '<div class="grab"></div><div class="sh-head"><div class="h2">'+esc(title)+'</div>'
    +'<button class="sh-close" data-act="close-sheet">'+I.x+'</button></div><div class="sh-body">'+body+'</div>';
}
function sheetContent(id){
  if(id.startsWith('sr-')){ const r=DB.routines.find(x=>x.id===id.slice(3)); return routineSheet(r); }
  if(id==='sr') return shFrame('Valider une routine',
    DB.routines.map(r=>{const p=routineProgress(r);return '<div class="action" data-act="opensheet" data-id="sr-'+r.id+'"><div class="check">'+(p.pct===100?I.check:'')+'</div><div class="body"><div class="t">'+esc(r.name)+'</div><div class="meta">'+p.done+'/'+p.tot+' étapes</div></div><span class="chev">'+I.chev+'</span></div>';}).join(''));
  if(id.startsWith('ci-')||id==='sc'){
    const o = id.startsWith('ci-')?DB.objectives.find(x=>x.id===id.slice(3)):DB.objectives.find(x=>x.type==='mesurable');
    return shFrame('Check-in objectif',
      '<div class="note" style="margin-bottom:16px">'+esc(o.name)+'</div>'
      +'<div class="field"><label>Nouvelle valeur ('+(o.unit||'%')+')</label><input type="number" inputmode="decimal" id="ciVal" value="'+(o.current||o.progress)+'"></div>'
      +'<button class="btn btn-primary" data-act="docheckin" data-id="'+o.id+'">Enregistrer le check-in</button>'
      +'<div class="note" style="margin-top:14px;text-align:center">Le check-in met à jour la <b style="color:var(--blanc)">progression réelle</b> — pas l\u2019alignement.</div>');
  }
  if(id==='lib'){
    const groups={}; DB.sport.library.forEach(x=>{(groups[x.grp]=groups[x.grp]||[]).push(x);});
    let L='<div class="field" style="margin-bottom:4px"><input id="exSearch" placeholder="Rechercher un exercice…" data-act="exsearch" autocomplete="off"></div><div class="liblist">';
    for(const g in groups){ L+='<div class="libgrp">'+g+'</div>';
      groups[g].forEach(x=>{ L+='<div class="libitem" data-act="libadd" data-id="'+x.id+'" data-name="'+esc(x.nm.toLowerCase())+'"><div class="libfig">'+muscleSVG(x.grp,26)+'</div><div class="t">'+esc(x.nm)+'</div><span class="chev">'+I.plus+'</span></div>'; }); }
    L+='</div>';
    return shFrame('Ajouter un exercice', L);
  }
  if(id==='sn') return shFrame('Ajouter un repas',
    '<button class="btn btn-primary" data-act="opensub" data-id="nutrition">Ouvrir le journal nutrition</button>'
    +'<div class="note" style="margin-top:14px;text-align:center">Petit-déj · déjeuner · dîner · snack</div>');
  if(id==='sa'){
    const ad=DB.addiction;
    return shFrame('Noter une rechute',
      '<div class="note" style="margin-bottom:16px">Sans jugement. Identifier le déclencheur, c\u2019est déjà avancer.</div>'
      +(ad.clean>0?'<div class="card"><div class="eyebrow" style="margin-bottom:6px">Ce que tu gardes</div>'
        +'<div class="note">Tes <b style="color:var(--or)">'+ad.clean+' jours</b> tenus ne disparaissent pas : ton record reste à <b style="color:var(--blanc)">'+Math.max(ad.best,ad.clean)+' jours</b>. Une rechute remet le compteur à zéro, pas ta progression.</div></div>':'')
      +'<div class="field"><label>Déclencheur</label><div class="chips">'+ad.triggers.concat(['Autre']).map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div></div>'
      +'<button class="btn btn-ghost" data-act="dorelapse">Enregistrer et repartir</button>'
      +'<button class="btn btn-line" style="margin-top:10px" data-act="close-sheet">J\u2019ai tenu finalement</button>');
  }
  if(id==='snote') return shFrame('Note rapide',
    '<div class="field"><textarea rows="4" placeholder="Une pensée, un ressenti, un déclic..."></textarea></div>'
    +'<button class="btn btn-primary" data-act="savenote">Enregistrer la note</button>');
  if(id==='newcycle'){
    const opts=DB.systems.slice(0,5);
    return shFrame('Nouveau cycle',
      '<div class="note" style="margin-bottom:16px">Démarrer un nouveau cycle archive le cycle actuel, puis installe le système choisi.</div>'
      + opts.map(sy=>'<div class="action" data-act="startcycle" data-id="'+sy.id+'"><div class="body"><div class="t">'+esc(sy.name)+'</div><div class="meta">'+sy.obj+' objectifs · '+sy.act+' actions</div></div><span class="chev">'+I.chev+'</span></div>').join('')
      + '<div class="action" data-act="startcycle" data-id="scratch"><div class="body"><div class="t">Partir de zéro</div><div class="meta">Je construis tout moi-même</div></div><span class="chev">'+I.chev+'</span></div>');
  }
  if(id==='srnew'){
    return shFrame('Nouvelle routine',
      '<div class="field"><label>Nom de la routine</label><input id="rnName" placeholder="Routine matin, Routine étudiant…" autocomplete="off"></div>'
      +'<div class="field"><label>Étapes (une par ligne)</label><textarea id="rnSteps" rows="5" placeholder="Réveil 7h\nGrand verre d\u2019eau\n3 priorités du jour"></textarea></div>'
      +'<button class="btn btn-primary" data-act="rnsave">Créer la routine</button>'
      +'<div class="note" style="margin-top:14px;text-align:center">Une routine est une checklist qui se réinitialise chaque jour.</div>');
  }
  if(id.startsWith('prev-')){
    const sys=[...DB.systems,...DB.publicSystems].find(x=>x.id===id.slice(5));
    if(!sys) return shFrame('Aperçu','<div class="note">Système introuvable.</div>');
    const canCopy = !sys.author || sys.copyable;
    return shFrame(sys.name,
      '<div class="note" style="margin-bottom:14px">'+esc(sys.desc)+'</div>'
      + (sys.tpl ? proposalCards(tplToBlocks(sys.tpl))
          + (sys.tpl.routine?'<div class="card"><div class="eyebrow" style="margin-bottom:8px">Routine incluse</div><div class="h2" style="font-size:15px">'+esc(sys.tpl.routine.name)+'</div><div class="note" style="margin-top:6px">'+sys.tpl.routine.steps.length+' étapes</div></div>':'')
        : '<div class="note">Contenu non détaillé.</div>')
      + (canCopy?'<button class="btn btn-primary" style="margin-top:6px" data-act="copysys" data-id="'+sys.id+'">'+I.copy+'Copier ce système</button>'
                :'<div class="note" style="text-align:center;margin-top:10px">Système en vitrine — inspire-toi, mais il n\u2019est pas copiable.</div>'));
  }
  if(id==='endday'){
    const score=dayAlignment(), st=alignStreak();
    const acts=DB.actions.filter(a=>a.today!==false);
    const done=acts.filter(a=>actionDone(a)), missed=acts.filter(a=>!actionDone(a));
    const isWeekEnd=(DB.alignHistory.length+1)%7===0;
    let msg;
    if(score>=90) msg='Journée impeccable. C\u2019est exactement ça, vivre selon ton système.';
    else if(score>=ALIGN_OK) msg='Journée alignée. Tu fais le travail — le résultat suivra.';
    else if(score>=40) msg='Journée partielle. Ce qui compte, c\u2019est de recommencer demain.';
    else msg='Journée difficile. Une journée ratée ne casse rien — l\u2019abandon, si.';
    return shFrame('Clôturer la journée',
      '<div class="endday-score"><div class="eds-v">'+score+'<sup>%</sup></div><div class="eds-l">Alignement du jour '+DB.cycle.day+'</div></div>'
      +'<div class="hint" style="margin:14px 0 16px">'+msg+'</div>'
      +(done.length?'<div class="card"><div class="eyebrow" style="margin-bottom:8px">Réalisé ('+done.length+')</div>'+done.map(a=>'<div class="lrow" style="padding:8px 0"><div class="lb"><div class="n" style="font-size:13px">✅ '+esc(a.title)+'</div></div></div>').join('')+'</div>':'')
      +(missed.length?'<div class="card"><div class="eyebrow" style="margin-bottom:8px">Non fait ('+missed.length+')</div>'+missed.map(a=>'<div class="lrow" style="padding:8px 0"><div class="lb"><div class="n" style="font-size:13px;color:var(--argent-2)">— '+esc(a.title)+'</div></div></div>').join('')+'</div>':'')
      +(st.todayCounts?'<div class="note" style="text-align:center;margin:12px 0">Série en cours : <b style="color:var(--or)">'+st.n+' jour'+(st.n>1?'s':'')+'</b></div>':'')
      +'<button class="btn btn-primary" style="margin-top:6px" data-act="doendday" data-id="'+(isWeekEnd?'week':'day')+'">Valider et passer au jour '+(DB.cycle.day+1)+'</button>'
      +'<div class="note" style="margin-top:12px;text-align:center">Tes habitudes se remettent à zéro pour demain.</div>');
  }
  if(id==='weekreview'){
    const wk=DB.alignHistory.slice(-7);
    const moy=avg(wk), prev=avg(DB.alignHistory.slice(-14,-7));
    const delta=prev?moy-prev:null;
    const sorted=[...DB.habitStats].sort((a,b)=>b.pct-a.pct);
    const best=sorted.slice(0,2), worst=[...sorted].reverse().slice(0,2);
    return shFrame('Ta semaine',
      '<div class="endday-score"><div class="eds-v">'+moy+'<sup>%</sup></div><div class="eds-l">Alignement moyen'+(delta!==null?' · <span class="'+(delta>=0?'up':'down')+'">'+(delta>=0?'+':'')+delta+' pts</span>':'')+'</div></div>'
      +'<div class="card" style="margin-top:16px"><div class="eyebrow" style="margin-bottom:12px">Tes 7 jours</div><div class="barchart">'
      + wk.map((v,i)=>'<div class="bcol"><div class="bfill'+(v>=ALIGN_OK?' now':'')+'" style="height:'+Math.max(4,v)+'%"></div><span class="bday">'+['L','M','M','J','V','S','D'][i%7]+'</span></div>').join('')
      +'</div></div>'
      +(best.length?'<div class="card"><div class="eyebrow" style="margin-bottom:8px">Tes points forts</div>'+best.map(h=>'<div class="lrow" style="padding:8px 0"><div class="lb"><div class="n" style="font-size:13px">✅ '+esc(h.k)+'</div></div><div class="val mono up" style="font-size:13px">'+h.pct+'%</div></div>').join('')+'</div>':'')
      +(worst.length?'<div class="card"><div class="eyebrow" style="margin-bottom:8px">À reprendre</div>'+worst.map(h=>'<div class="lrow" style="padding:8px 0"><div class="lb"><div class="n" style="font-size:13px">❌ '+esc(h.k)+'</div></div><div class="val mono down" style="font-size:13px">'+h.pct+'%</div></div>').join('')+'</div>':'')
      +'<button class="btn btn-primary" style="margin-top:6px" data-act="close-sheet">Continuer</button>');
  }
  if(id==='cycleend'){
    const al=cycleAlignment()||0;
    const sorted=[...DB.habitStats].sort((a,b)=>b.pct-a.pct);
    const objDone=DB.objectives.filter(o=>objProg(o)>=100).length;
    const objProgAvg=DB.objectives.length?Math.round(DB.objectives.reduce((n,o)=>n+objProg(o),0)/DB.objectives.length):0;
    return shFrame('Fin de cycle',
      '<div class="cyc-hero"><div class="ch-k">'+esc(DB.cycle.name)+'</div>'

  if(id==='confirmdel'){

  if(id==='act'){

            +'<div class="sys-link" data-act="gosystem">Voir dans mon système</div>':''));
  }
  if(id==='obj'){
    const t=tmpObj||{type:'mesurable'};
    const types=[['mesurable','Mesurable'],['quantitatif','Quantitatif'],['etapes','Par étapes'],['streak','Streak'],['manuel','Manuel']];
    const needTarget=(t.type!=='etapes'&&t.type!=='manuel');
    return shFrame('Nouvel objectif',
      '<div class="field"><label>Domaine</label><div class="chips">'+DOMAINS.map(d=>'<span class="chip '+(t.dom===d?'on':'')+'" data-act="objdom" data-id="'+d+'">'+d+'</span>').join('')+'</div></div>'
      +'<div class="field"><label>Nom de l\u2019objectif</label><input id="objName" data-act="objnameinput" placeholder="Ex. Perdre 5 kg, Lire 10 livres…" value="'+esc(t.name||'')+'" autocomplete="off"></div>'
      +'<div class="field"><label>Type'+(t.typeManual?'':' <span id="objTypeHint" class="type-hint">· suggéré</span>')+'</label><div class="chips" id="objTypeChips">'+types.map(x=>'<span class="chip '+(t.type===x[0]?'on':'')+'" data-act="objtype" data-id="'+x[0]+'">'+x[1]+'</span>').join('')+'</div></div>'
      +'<div id="objTargetWrap" style="display:'+(needTarget?'flex':'none')+';gap:10px" class="field"><div style="flex:1"><label>Valeur cible</label><input id="objTarget" type="number" inputmode="decimal" placeholder="'+(t.type==='streak'?'30':'10')+'" value="'+(t.target||'')+'"></div><div style="flex:1"><label>Unité</label><input id="objUnit" placeholder="'+(t.type==='streak'?'jours':(t.type==='tracker'?'km, pages…':'kg, livres…'))+'" value="'+esc(t.unit||'')+'" autocomplete="off"></div></div>'
      +'<div id="objTypeNote" class="note" style="margin:2px 0 14px;display:'+(needTarget?'none':'block')+'">'+(t.type==='manuel'?'Tu estimeras l\u2019avancement avec un curseur.':'Tu ajouteras les étapes ensuite, dans l\u2019objectif.')+'</div>'
      +'<div class="field"><label>Date cible (optionnel)</label><input id="objDate" placeholder="Ex. 30 sept." value="'+esc(t.date||'')+'" autocomplete="off"></div>'
      +'<button class="btn btn-primary" data-act="objsave">Créer l\u2019objectif</button>'
      +'<div class="note" style="margin-top:14px;text-align:center">Tu pourras lui lier des actions juste après.</div>');
  }
  if(id.startsWith('step-')){
    return shFrame('Ajouter une étape',
      '<div class="field"><label>Intitulé de l\u2019étape</label><input id="stepTitle" placeholder="Ex. Bêta fermée" autocomplete="off"></div>'
      +'<button class="btn btn-primary" data-act="stepsave" data-id="'+id.slice(5)+'">Ajouter l\u2019étape</button>');

}
function routineSheet(r){
  const p=routineProgress(r);
  return shFrame(r.name,
    '<div class="kicker" style="margin-bottom:14px"><span class="dot"></span>'+esc(r.days)+(r.timed?' · horaire':'')+' · '+p.done+'/'+p.tot+' ('+p.pct+'%)</div>'
    + r.steps.map((s,i)=>'<div class="rstep '+(s.done?'done':'')+'" data-act="rstep" data-id="'+r.id+'" data-i="'+i+'">'
      +(r.timed?'<div class="tm">'+esc(s.tm)+'</div>':'')
      +'<div class="rdot">'+I.check+'</div><div class="rl">'+esc(s.t)+'</div></div>').join('')
    + '<button class="btn btn-primary" style="margin-top:18px" data-act="close-sheet">'+(p.pct===100?'Routine terminée':'Continuer')+'</button>'
    + '<div class="note" style="text-align:center;margin-top:12px">Reset automatique chaque jour.</div>');
}
/* ============================================================
   ROUTER / RENDER
   ============================================================ */
function render(){
  if(!state.onboarded){ app().innerHTML=screenOnboarding(); return; }
  if(state.sub){
    const m={sport:subSport,nutrition:subNutrition,addiction:subAddiction,lifestyle:subLifestyle,assistant:subAssistant};
    const inSession = state.sub.kind==='sport' && state.sub.view==='session' && !!DB.sport.active;
    let sc='';
    if(state.sub.kind==='objective') sc=subObjective(state.sub.id);
    else sc=(m[state.sub.kind]||(()=>'<div class="view"></div>'))();
    app().innerHTML = sc + (inSession?'':nav());
    ensureSportTimer(inSession);
    return;
  }
  ensureSportTimer(false);
  let content='';
  switch(state.screen){
    case 'dashboard': content=topbar('','',{wordmark:true})+screenDashboard(); break;
    case 'progression': content=topbar('Analyse','Progression')+screenProgression(); break;
    case 'systeme': content=screenSysteme(); break;
    case 'bibliotheque': content=screenBibliotheque(); break;
    case 'academie': content=screenAcademie(); break;
    case 'profile': content=screenProfile(); break;
  }
  app().innerHTML=content+nav();
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
function findAct(e){ let el=e.target; while(el && el!==document){ if(el.dataset && el.dataset.act) return el; el=el.parentNode; } return null; }

document.addEventListener('click',e=>{
  if(swMoved){ swMoved=false; return; }   // c'était un swipe, pas un tap
  const el=findAct(e);
  const openRow=document.querySelector('.swipe-wrap.open');
  if(openRow){
    const insideOpen = el && el.closest && el.closest('.swipe-wrap.open');
    if(!insideOpen){ closeSwipes(); if(!el) return; }
  }
  if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'go': state.sub=null; state.screen=el.dataset.screen; render(); break;
    case 'back': state.sub=null; render(); break;
    case 'sub': state.sub={kind:id}; render(); break;
    case 'objective': state.sub={kind:'objective',id}; render(); break;
    case 'opensub': closeSheet(); state.sub={kind:id}; render(); break;
    case 'openassistant': closeSheet(); asst={proposal:null,last:''}; state.sub={kind:'assistant'}; render(); break;
    case 'asstsugg': { asst.last=id; const r=assistantEngine(id); asst.proposal=r.blocks; asst.matched=r.matched; render(); break; }
    case 'asstsend': { const ti=$('#asstInput'); asst.last=ti?ti.value:''; const r=assistantEngine(asst.last); asst.proposal=r.blocks; asst.matched=r.matched; render(); break; }
    case 'asstreset': { asst={proposal:null,last:''}; render(); break; }
    case 'asstcreate': {
      if(!asst.proposal) break;
      const firstId=instantiateBlocks(asst.proposal);
      asst={proposal:null,last:''}; state.sub={kind:'objective',id:firstId}; render(); toast('Système créé · objectifs et habitudes ajoutés'); break;
    }

    case 'toggle': case 'action': {
      const aid = id || el.dataset.id;
      const a=DB.actions.find(x=>x.id===aid);
      if(!a) break;
      if(a.type==='routine'){ openSheet('sr-'+a.ref); break; }
      if(a.type==='workout'){ state.sub={kind:'sport',view:DB.sport.active?'session':'home'}; render(); break; }
      if(a.type==='nutrition'){ state.sub={kind:'nutrition'}; render(); break; }
      if(a.type==='addiction'){
        a.done=!a.done; const delta=a.done?1:-1;
        DB.addiction.clean=Math.max(0,DB.addiction.clean+delta);
        if(DB.addiction.clean>DB.addiction.best) DB.addiction.best=DB.addiction.clean;
        actObjIds(a).forEach(oid=>{ const o=DB.objectives.find(x=>x.id===oid); if(o&&o.type==='streak'){ o.current=clamp(o.current+delta,0,o.target); recomputeProg(o); } });
        toast(a.done?'Journée sans rechute validée · '+DB.addiction.clean+' jours':'Action annulée'); render(); break;
      }
      a.done=!a.done; render();
      break;
    }
    case 'progtab': progTab=id; render(); break;
    case 'systab': sysTab=id; render(); break;
    case 'dommove': { const d=DB.domains, i=d.indexOf(id), dir=el.dataset.dir; const j=dir==='up'?i-1:i+1; if(i>=0&&j>=0&&j<d.length){ const tmp=d[i]; d[i]=d[j]; d[j]=tmp; } $('#sheet').innerHTML=sheetContent('domains'); break; }
    case 'objpriomove': { const p=DB.priorities, i=p.indexOf(id), dir=el.dataset.dir; const j=dir==='up'?i-1:i+1; if(i>=0&&j>=0&&j<p.length){ const tmp=p[i]; p[i]=p[j]; p[j]=tmp; } $('#sheet').innerHTML=sheetContent('objpriority'); break; }
    case 'doendday': {
      const score=advanceDay();
      closeSheet();
      if(DB.cycle.day>=DB.cycle.total){ render(); openSheet('cycleend'); break; }
      if(id==='week'){ render(); openSheet('weekreview'); break; }
      render(); toast('Jour '+DB.cycle.day+' · alignement d\u2019hier enregistré à '+score+'%'); break;
    }
    case 'startcycle': {
      const al=cycleAlignment();
      DB.cycleHistory.unshift({id:'h'+(++seq),year:2026,name:DB.cycle.name,score:al==null?0:al,days:DB.cycle.day,domains:[...DB.domains].slice(0,4)});
      DB.objectives.length=0; DB.priorities.length=0; DB.actions.length=0; DB.routines.length=0;
      DB.alignHistory.length=0; DB.habitStats.length=0;
      DB.cycle.day=1;
      if(id!=='scratch'){ const sys=DB.systems.find(x=>x.id===id); if(sys){ DB.cycle.name=sys.name; instantiateSystem(sys); } }
      else DB.cycle.name='Cycle personnalisé';
      closeSheet(); state.screen='dashboard'; state.sub=null; render();
      toast(id==='scratch'?'Nouveau cycle lancé. Construis ton système.':'Nouveau cycle lancé · système installé'); break;
    }
    case 'domtoggle': {
      const i=DB.domains.indexOf(id);
      if(i>=0){
        const used=DB.objectives.some(o=>o.dom===id);
        if(used){ toast('Ce domaine porte des objectifs — retire-les d\u2019abord.'); break; }
        if(DB.domains.length<=1){ toast('Garde au moins un domaine actif.'); break; }
        DB.domains.splice(i,1);
      } else DB.domains.push(id);
      $('#sheet').innerHTML=sheetContent('adddomain'); break;
    }
    case 'lifeaddone': { const l=LIFE_LIB.find(x=>x.k===id); if(l&&!DB.lifestyle.some(x=>x.k===l.k)) DB.lifestyle.push({k:l.k,v:'—',ic:l.ic,pct:0}); $('#sheet').innerHTML=sheetContent('lifeadd'); break; }
    case 'liferemove': { const i=DB.lifestyle.findIndex(x=>x.k===id); if(i>=0)DB.lifestyle.splice(i,1); $('#sheet').innerHTML=sheetContent('lifeadd'); break; }
    case 'libtab': libTab=id; render(); break;

    case 'sheet': openSheet(id); break;
    case 'opensheet': openSheet(id); break;
    case 'close-sheet': closeSheet(); break;

    case 'rstep': { const r=DB.routines.find(x=>x.id===id); r.steps[+el.dataset.i].done=!r.steps[+el.dataset.i].done; $('#sheet').innerHTML=routineSheet(r); break; }
    case 'objstep': { const o=DB.objectives.find(x=>x.id===id); const st=o.steps[+el.dataset.i]; st.done=!st.done; recomputeProg(o); render(); toast('Étape mise à jour · progression '+objProg(o)+'%'); break; }
    case 'addstep': { tmpObj=null; openSheet('step-'+id); break; }
    case 'stepsave': { const o=DB.objectives.find(x=>x.id===id); const t=($('#stepTitle').value||'').trim(); if(t){ o.steps.push({t,done:false}); recomputeProg(o);} closeSheet(); render(); break; }
    case 'delstep': { const o=DB.objectives.find(x=>x.id===id); o.steps.splice(+el.dataset.i,1); recomputeProg(o); render(); break; }
    case 'qtyplus': { const o=DB.objectives.find(x=>x.id===id); o.current=Math.min(o.target,o.current+1); recomputeProg(o); render(); toast('Progression · '+objResult(o)); break; }
    case 'qtyminus': { const o=DB.objectives.find(x=>x.id===id); o.current=Math.max(0,o.current-1); recomputeProg(o); render(); break; }    case 'streakplus': { const o=DB.objectives.find(x=>x.id===id); o.current=Math.min(o.target,o.current+1); recomputeProg(o); render(); toast('Bravo — '+o.current+' jours tenus'); break; }
    case 'streakreset': { const o=DB.objectives.find(x=>x.id===id); o.current=0; recomputeProg(o); render(); toast('On repart. Sans jugement.'); break; }

    case 'newhabit': { tmpAct={objIds:[],title:'',freq:'daily'}; openSheet('act'); break; }
    case 'actmenu': { closeSwipes(); const wrap=document.querySelector('.swipe-wrap[data-swipe="'+id+'"]'); if(wrap) wrap.classList.add('open'); break; }

    case 'doactdel': { const i=DB.actions.findIndex(x=>x.id===pendingDel); if(i>=0){ const nm=DB.actions[i].title; DB.actions.splice(i,1); toast('« '+nm+' » supprimée'); } pendingDel=null; closeSheet(); render(); break; }
    case 'gosystem': { closeSheet(); state.sub=null; state.screen='systeme'; sysTab='structure'; render(); break; }
    case 'objaddaction': { tmpAct={objIds:[id],title:'',freq:'daily'}; openSheet('act'); break; }
    case 'actfreq': { if(tmpAct){ const ti=$('#actTitle'); if(ti)tmpAct.title=ti.value; tmpAct.freq=id; } $('#sheet').innerHTML=sheetContent('act'); break; }
    case 'actobj': { if(tmpAct){ const ti=$('#actTitle'); if(ti)tmpAct.title=ti.value; tmpAct.objIds=tmpAct.objIds||[]; const i=tmpAct.objIds.indexOf(id); if(i<0)tmpAct.objIds.push(id); else tmpAct.objIds.splice(i,1); } $('#sheet').innerHTML=sheetContent('act'); break; }
    case 'actedit': { const a=DB.actions.find(x=>x.id===id); if(a){ tmpAct={id:a.id,objIds:actObjIds(a).slice(),title:a.title,freq:a.freq||'daily'}; openSheet('act'); } break; }
    case 'actsave': {
      const title=($('#actTitle').value||'').trim(); if(!title){ toast('Donne un intitulé à l\u2019habitude'); break; }
      if(tmpAct.id){ const a=DB.actions.find(x=>x.id===tmpAct.id); if(a){ a.title=title; a.freq=tmpAct.freq; a.objIds=(tmpAct.objIds||[]).slice(); } toast('Habitude modifiée'); }
      else { const ids=tmpAct.objIds||[]; const o=DB.objectives.find(x=>x.id===ids[0]); const dom=o?o.dom:''; const isFirst=o&&o.type==='streak'&&o.dom==='Addictions'&&objActions(o).length===0; const na=makeAction(title,dom,ids.slice(),tmpAct.freq,isFirst); na.createdDay=DB.cycle.day;
        DB.actions.push(na); toast(na.type!=='simple' ? 'Habitude ajoutée · liée au tracker '+({workout:'Sport',nutrition:'Nutrition',addiction:'Anti-addiction'}[na.type]) : 'Habitude ajoutée'); }
