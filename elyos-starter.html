    case 'actdelete': { const i=DB.actions.findIndex(x=>x.id===id); if(i>=0)DB.actions.splice(i,1); tmpAct=null; closeSheet(); render(); toast('Habitude supprimée'); break; }

    case 'newobj': { tmpObj={type:'mesurable'}; openSheet('obj'); break; }
    case 'rnsave': { const nm=($('#rnName').value||'').trim(); const lines=($('#rnSteps').value||'').split('\n').map(x=>x.trim()).filter(Boolean); if(!nm){ toast('Donne un nom à la routine'); break; } const rid='r'+(++seq); DB.routines.push({id:rid,name:nm,sub:'Personnalisée',timed:false,days:'Tous les jours',steps:lines.map(t=>({t,tm:'',done:false}))}); DB.actions.push({id:'a'+(++seq),type:'routine',ref:rid,title:nm,dom:'Lifestyle',objIds:[],freq:'daily',today:true,done:false}); closeSheet(); render(); toast('Routine créée'); break; }
    case 'cycledup': { const c=DB.cycle, al=cycleAlignment(); const n=DB.cycleHistory.filter(h=>h.series===c.id).length+1; DB.cycleHistory.unshift({id:'h'+(++seq),year:2026,name:c.name+' #'+n,score:al,days:c.total,domains:[...DB.domains].slice(0,4),series:c.id}); render(); toast('Cycle dupliqué — la copie repart à zéro, tu pourras comparer.'); break; }
    case 'cyclearchive': { const c=DB.cycle, al=cycleAlignment(); DB.cycleHistory.unshift({id:'h'+(++seq),year:2026,name:c.name,score:al,days:c.day,domains:[...DB.domains].slice(0,4)}); render(); toast('Cycle archivé dans ton historique.'); break; }
    case 'objdom': { if(tmpObj){ syncObjFields(); tmpObj.dom=id; } $('#sheet').innerHTML=sheetContent('obj'); break; }
    case 'objtype': { if(tmpObj){ syncObjFields(); tmpObj.type=id; tmpObj.typeManual=true; } $('#sheet').innerHTML=sheetContent('obj'); break; }
    case 'objsave': {
      const name=($('#objName').value||'').trim(); const dom=tmpObj.dom;
      if(!name){ toast('Donne un nom à l\u2019objectif'); break; } if(!dom){ toast('Choisis un domaine'); break; }
      const type=tmpObj.type;
      const oid=instantiateObjective({dom,n:name,type,
        target:parseFloat($('#objTarget')?$('#objTarget').value:0)||(type==='streak'?30:10),
        unit:($('#objUnit')?$('#objUnit').value.trim():'')||(type==='streak'?'jours':'')});
      const o=DB.objectives.find(x=>x.id===oid); o.targetDate=($('#objDate')?$('#objDate').value.trim():'');
      tmpObj=null; closeSheet(); state.sub={kind:'objective',id:oid}; render(); toast('Objectif créé. Ajoute tes actions.'); break;
    }

    case 'setdone': { const s=DB.sport.active.ex[+el.dataset.e].sets[+el.dataset.s]; s.done=!s.done; if(s.done) restEnd=Date.now()+90000; render(); break; }
    case 'addset': { const ex=DB.sport.active.ex[+el.dataset.e]; const last=ex.sets[ex.sets.length-1]||{kg:0,reps:0}; ex.sets.push({kg:last.kg,reps:last.reps,done:false}); render(); break; }
    case 'delexercise': { DB.sport.active.ex.splice(+el.dataset.e,1); render(); break; }
    case 'resumesession': state.sub={kind:'sport',view:'session'}; render(); break;
    case 'sportback': state.sub={kind:'sport'}; render(); break;
    case 'startsession': {
      const sp=DB.sport;
      if(id==='empty'){ sp.active={nm:'Séance libre',sub:'Personnalisée',started:Date.now(),ex:[]}; }
      else { const t=sp.templates.find(x=>x.id===id); sp.active={nm:t.nm,sub:t.sub,started:Date.now(),
        ex:t.exIds.map(xi=>{const lib=sp.library.find(l=>l.id===xi)||{nm:xi}; const pv=prevSet(xi); return {id:xi,nm:lib.nm,grp:lib.grp,sets:[{kg:pv.kg,reps:pv.reps,done:false},{kg:pv.kg,reps:pv.reps,done:false}]};}) }; }
      restEnd=null; state.sub={kind:'sport',view:'session'}; render(); break;
    }
    case 'openlibrary': openSheet('lib'); break;
    case 'libadd': { const lib=DB.sport.library.find(l=>l.id===id); const pv=prevSet(id); DB.sport.active.ex.push({id:lib.id,nm:lib.nm,grp:lib.grp,sets:[{kg:pv.kg,reps:pv.reps,done:false}]}); closeSheet(); render(); toast(lib.nm+' ajouté'); break; }
    case 'cancelsession': { DB.sport.active=null; restEnd=null; state.sub={kind:'sport'}; render(); toast('Séance annulée'); break; }
    case 'restadd': if(restEnd) restEnd+=15000; sportTick(); break;
    case 'restskip': { restEnd=null; const rb=$('#restBar'); if(rb) rb.remove(); break; }
    case 'finishworkout': {
      const a=DB.sport.active; if(!a) break;
      const v=vol(a.ex), sets=setsDone(a.ex), dur=fmtDur(Date.now()-a.started);
      DB.sport.history.unshift({date:"Aujourd'hui",nm:a.nm,vol:v,sets,dur});
      const act=DB.actions.find(x=>x.type==='workout'); if(act) act.done=true;
      DB.sport.active=null; restEnd=null; state.sub={kind:'sport'}; render();
      toast('Séance enregistrée · '+v.toLocaleString('fr-FR')+' kg · '+sets+' séries'); break;
    }
    case 'addfood': { const m=DB.nutrition.meals[+el.dataset.m]; m.items.push({f:'Aliment ajouté',k:250,p:20}); render(); toast('Aliment ajouté au journal'); break; }

    case 'copysys': {
      const sys=[...DB.systems,...DB.publicSystems].find(x=>x.id===id);
      instantiateSystem(sys);
      closeSheet(); state.screen='dashboard'; state.sub=null; render();
      toast('Système « '+(sys?sys.name:'')+' » copié · objectifs et habitudes créés'); break;
    }
    case 'acta': { const [k,v]=id.split('|'); if(k==='copysys'){const sys=[...DB.systems,...DB.publicSystems].find(x=>x.id===v); toast('Système « '+(sys?sys.name:'')+' » ajouté à ton cycle');} else if(k==='addrout'){toast('Routine ajoutée à ton cycle');} else if(k==='track'){state.screen='systeme';sysTab='trackers';render();} else toast('Habitude ajoutée'); break; }

    case 'docheckin': { const o=DB.objectives.find(x=>x.id===id); const v=parseFloat($('#ciVal').value); if(!isNaN(v)){ o.current=v; recomputeProg(o); } closeSheet(); render(); toast('Valeur mise à jour · '+objResult(o)); break; }
    case 'dorelapse': { const ad=DB.addiction; ad.best=Math.max(ad.best,ad.clean); ad.relapses++; ad.clean=0; ad.log=[]; const a=DB.actions.find(x=>x.type==='addiction'); if(a){ a.done=false; actObjIds(a).forEach(oid=>{ const o=DB.objectives.find(x=>x.id===oid); if(o&&o.type==='streak'){ o.current=0; recomputeProg(o); } }); } closeSheet(); state.sub={kind:'addiction'}; render(); toast(ad.best>0?'Noté. Ton record de '+ad.best+' jours reste acquis — on repart.':'Noté. On repart — sans jugement.'); break; }
    case 'savenote': closeSheet(); toast('Note enregistrée'); break;

    case 'toggle-public': DB.profile.public=!DB.profile.public; render(); break;
    case 'toggle-copy': el.classList.toggle('on'); break;
    case 'showtoggle': DB.profile.show[id]=!DB.profile.show[id]; render(); break;

    case 'obnext': if(state.ob.step===0){state.ob.step=1;} else {state.ob.step=clamp(state.ob.step+1,1,4);} render(); break;
    case 'obback': {
      if(state.ob.step===3 && state.ob.mode && state.ob.mode!=='scratch'){ state.ob.mode=null; state.ob.aiBlocks=null; }
      else { state.ob.step=clamp(state.ob.step-1,1,4); if(state.ob.step===3 && state.ob.mode==='scratch'){ state.ob.mode=null; } }
      render(); break;
    }
    case 'obskip': state.onboarded=true; state.screen='dashboard'; render(); break;
    case 'obselect': { const s=state.ob.step; if(s===1)state.ob.cycle=id; else if(s===3){ state.ob.system=id; state.ob.aiBlocks=null; } render(); setTimeout(()=>{ if(state.ob.step===s){ state.ob.step=clamp(s+1,1,4); render(); } },240); break; }
    case 'obmode': {
      state.ob.mode=id;
      if(id==='scratch'){ state.ob.system='scratch'; state.ob.aiBlocks=null; render();
        setTimeout(()=>{ if(state.ob.step===3){ state.ob.step=4; render(); } },240); }
      else render();
      break;
    }
    case 'obmodeback': { state.ob.mode=null; state.ob.system=null; state.ob.aiBlocks=null; render(); break; }
    case 'obpropose': { const ti=$('#obText'); state.ob.text=ti?ti.value:''; const r=assistantEngine(state.ob.text); state.ob.aiBlocks=r.blocks; state.ob.aiMatched=r.matched; state.ob.step=4; render(); break; }
    case 'obsugg': { state.ob.text=id; const r=assistantEngine(id); state.ob.aiBlocks=r.blocks; state.ob.aiMatched=r.matched; state.ob.step=4; render(); break; }
    case 'obdom': { const d=state.ob.domains; const i=d.indexOf(id); if(i<0){ if(d.length>=4){ toast('4 domaines, c\u2019est déjà bien pour démarrer. Retire-en un pour en ajouter un autre.'); break; } d.push(id); } else d.splice(i,1); render(); break; }
    case 'obfinish': {
      state.onboarded=true; state.screen='dashboard';
      if(state.ob.cycle){DB.cycle.total=+state.ob.cycle; DB.cycle.day=1;}
      let firstId=null;
      if(state.ob.aiBlocks && state.ob.aiBlocks.length){ firstId=instantiateBlocks(state.ob.aiBlocks); }
      else if(state.ob.system && state.ob.system!=='scratch'){ const sys=DB.systems.find(x=>x.id===state.ob.system); if(sys) firstId=instantiateSystem(sys); }
      toast(firstId ? 'Cycle lancé · ton système est prêt. Coche ta première action.' : 'Cycle lancé. Construis ton premier objectif quand tu veux.');
      render(); break;
    }

    case 'reset': location.reload(); break;
    case 'toast': toast(id); break;
  }
});

/* number inputs in sport tracker */
/* ============================================================
   SWIPE — révéler Modifier / Supprimer sur une habitude
   ============================================================ */
const SWIPE_MAX=150, SWIPE_TRIGGER=52;
let swStart=null, swWrap=null, swMoved=false;
function closeSwipes(except){
  document.querySelectorAll('.swipe-wrap.open').forEach(w=>{ if(w!==except) w.classList.remove('open'); });
  document.querySelectorAll('.swipe-face').forEach(f=>{ f.style.transform=''; });
}
function swipeStart(x,y,target){
  const wrap=target.closest && target.closest('.swipe-wrap');
  if(!wrap){ closeSwipes(); return; }
  swStart={x,y}; swWrap=wrap; swMoved=false;
}
function swipeMove(x,y){
  if(!swStart||!swWrap) return false;
  const dx=x-swStart.x, dy=y-swStart.y;
  if(Math.abs(dy)>Math.abs(dx)) return false;      // défilement vertical : on laisse passer
  if(Math.abs(dx)<6) return false;
  swMoved=true;
  const face=swWrap.querySelector('.swipe-face');
  const off=Math.max(-SWIPE_MAX, Math.min(0, dx));  // uniquement vers la gauche
  if(face) face.style.transform='translateX('+off+'px)';
  return true;
}
function swipeEnd(){
  if(!swWrap){ swStart=null; return; }
  const face=swWrap.querySelector('.swipe-face');
  const cur=face?(new w3Matrix(face.style.transform)).x:0;
  if(cur<=-SWIPE_TRIGGER){ closeSwipes(swWrap); swWrap.classList.add('open'); if(face) face.style.transform=''; }
  else { swWrap.classList.remove('open'); if(face) face.style.transform=''; }
  swStart=null; swWrap=null;
  // le drapeau ne doit avaler que le clic immédiat du geste, pas le suivant
  if(swMoved) setTimeout(()=>{ swMoved=false; },0);
}
function w3Matrix(t){ const m=/translateX\((-?\d+(?:\.\d+)?)px\)/.exec(t||''); return {x:m?parseFloat(m[1]):0}; }
document.addEventListener('touchstart',e=>{ const t=e.touches[0]; swipeStart(t.clientX,t.clientY,e.target); },{passive:true});
document.addEventListener('touchmove',e=>{ const t=e.touches[0]; swipeMove(t.clientX,t.clientY); },{passive:true});
document.addEventListener('touchend',swipeEnd,{passive:true});
document.addEventListener('mousedown',e=>swipeStart(e.clientX,e.clientY,e.target));
document.addEventListener('mousemove',e=>{ if(swStart) swipeMove(e.clientX,e.clientY); });
document.addEventListener('mouseup',swipeEnd);

document.addEventListener('input',e=>{
  const el=findAct(e); if(!el) return;
  if(el.dataset.act==='setval'){ const s=DB.sport.active.ex[+el.dataset.e].sets[+el.dataset.s]; const f=el.dataset.f; s[f]=parseFloat(el.value)||0; }
  if(el.dataset.act==='freeprog'){ const o=DB.objectives.find(x=>x.id===el.dataset.id); o.progress=+el.value; }
  if(el.dataset.act==='manualset'){ const o=DB.objectives.find(x=>x.id===el.dataset.id); o.current=+el.value; recomputeProg(o); const g=$('.gz-v.gold'); if(g)g.textContent=objProg(o)+'%'; const fills=document.querySelectorAll('.bar.gold > i'); fills.forEach(f=>f.style.width=objProg(o)+'%'); const card=el.closest('.card'); if(card){const big=card.querySelector('.mono');if(big)big.textContent=(o.current||0)+'%';} }
  if(el.dataset.act==='exsearch'){ const q=el.value.toLowerCase().trim();
    document.querySelectorAll('.libitem').forEach(it=>{ it.style.display=it.dataset.name.includes(q)?'':'none'; });
    document.querySelectorAll('.libgrp').forEach(g=>{ let n=g.nextElementSibling,vis=false; while(n&&!n.classList.contains('libgrp')){ if(n.classList.contains('libitem')&&n.style.display!=='none')vis=true; n=n.nextElementSibling;} g.style.display=vis?'':'none'; }); }
  if(el.dataset.act==='objnameinput'){
    if(tmpObj){ tmpObj.name=el.value;
      if(!tmpObj.typeManual && el.value.trim().length>2){
        const guess=guessObjType(el.value); tmpObj.type=guess;
        document.querySelectorAll('#objTypeChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.id===guess));
        const wrap=$('#objTargetWrap'), noteEl=$('#objTypeNote'), hint=$('#objTypeHint');
        const needTarget=(guess!=='etapes'&&guess!=='manuel');
        if(wrap) wrap.style.display=needTarget?'flex':'none';
        if(noteEl){ noteEl.style.display=needTarget?'none':'block'; noteEl.textContent = guess==='manuel'?'Tu estimeras l\u2019avancement avec un curseur.':'Tu ajouteras les étapes ensuite, dans l\u2019objectif.'; }
        if(hint) hint.style.display='inline';
      }
    }
  }
});

   INIT

DB.objectives.forEach(recomputeProg);
render();
